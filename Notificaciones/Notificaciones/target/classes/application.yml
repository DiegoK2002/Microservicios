spring:
    application:
        name: Notificaciones
    datasource:
        url: jdbc:mysql://localhost:3306/notificaciones_db
        username: root
        password: ""
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true

logging:
    level:
        root: INFO

server:
    port: 8088

springdoc:
    api-docs:
        enabled: true
        version: openapi-3-0
    swagger-ui:
        enabled: true

eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/