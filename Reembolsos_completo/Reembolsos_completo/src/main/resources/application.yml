spring:
    application:
        name: Reembolsos
    datasource:
        url: jdbc:mysql://localhost:3306/reembolsos_db
        username: root
        password: ""
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
        open-in-view: false

server:
    port: 8087

springdoc:
    api-docs:
        enabled: true
        version: openapi-3-0
    swagger-ui:
        enabled: true

eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true