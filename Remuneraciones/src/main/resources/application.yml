spring:
  application:
    name: Remuneraciones
  datasource:
    url: jdbc:mysql://localhost:3306/remuneraciones_db
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: INFO
    cl.duoc.Remuneraciones: DEBUG