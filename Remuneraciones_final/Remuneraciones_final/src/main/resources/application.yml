spring:
    application:
        name: Remuneraciones
    datasource:
        url: jdbc:mysql://localhost:3306/remuneraciones_db
        username: root
        password: ""
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQL8Dialect
                format_sql: true

server:
    port: 8090

logging:
    level:
        root: INFO
        cl:
            duoc:
                Remuneraciones: DEBUG

springdoc:
    api-docs:
        enabled: true
        version: openapi-3-0
    swagger-ui:
        enabled: true

eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true